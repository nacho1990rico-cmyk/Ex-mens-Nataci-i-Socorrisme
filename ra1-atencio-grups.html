<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Examen</title>
<style>
  :root{
    --paper: #EEF1F2;
    --card: #FFFFFF;
    --ink: #1B2430;
    --ink-soft: #4A5568;
    --line: #C9CDD1;
    --red: #A63D2F;
    --teal: #3E6259;
    --teal-soft: #E1EAE7;
    --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0; min-height:100vh;
    background:var(--paper); color:var(--ink);
    font-family:var(--sans);
    -webkit-user-select:none; user-select:none;
  }
  #app{ min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:32px 16px 80px; }
  .card{
    width:100%; max-width:640px; background:var(--card);
    border-top:4px solid var(--red);
    box-shadow: 0 1px 2px rgba(27,36,48,0.08);
    padding:32px 28px;
  }
  .hidden{ display:none !important; }
  h1{ font-family:var(--serif); font-size:1.6rem; margin:0 0 4px; font-weight:600; }
  .subtitle{ color:var(--ink-soft); font-size:0.92rem; margin:0 0 24px; line-height:1.5;}
  label{ display:block; font-size:0.85rem; color:var(--ink-soft); margin-bottom:6px; }
  input[type=text]{
    width:100%; padding:10px 12px; font-size:1rem; font-family:var(--sans);
    border:1px solid var(--line); background:#fff; color:var(--ink); margin-bottom:18px;
  }
  input[type=text]:focus{ outline:2px solid var(--teal); outline-offset:1px; }
  textarea{
    width:100%; font-family:var(--sans); font-size:0.85rem; padding:10px 12px;
    border:1px solid var(--line); resize:none; margin-bottom:16px; color:var(--ink); background:#fafafa;
  }
  button{
    font-family:var(--sans); font-size:0.95rem; font-weight:600; cursor:pointer;
    border:none; padding:12px 22px; background:var(--ink); color:#fff;
  }
  button:hover{ background:#000; }
  button.secondary{ background:transparent; color:var(--ink); border:1px solid var(--line); }
  button.secondary:hover{ background:#f2f2f2; }
  button:disabled{ opacity:0.4; cursor:not-allowed; }
  .row{ display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
  .examheader{ display:flex; justify-content:space-between; align-items:baseline; border-bottom:1px solid var(--line); padding-bottom:14px; margin-bottom:22px;}
  .examheader h2{ font-family:var(--serif); font-size:1.15rem; margin:0; }
  .timer{ font-variant-numeric: tabular-nums; font-size:1.05rem; font-weight:600; color:var(--ink); }
  .timer.low{ color:var(--red); }
  .progress{ font-size:0.85rem; color:var(--ink-soft); margin-bottom:6px; }
  .qtext{ font-size:1.12rem; line-height:1.5; margin:0 0 20px; }
  .option{
    display:flex; align-items:flex-start; gap:12px; padding:12px 14px;
    border:1px solid var(--line); margin-bottom:10px; cursor:pointer;
  }
  .option:hover{ border-color:var(--ink-soft); }
  .option.selected{ border-color:var(--teal); background:var(--teal-soft); }
  .option input{ margin-top:3px; }
  .navrow{ display:flex; justify-content:space-between; margin-top:26px; }
  #violation-banner{
    position:fixed; top:0; left:0; right:0; z-index:50;
    background:var(--red); color:#fff; text-align:center;
    padding:14px 16px; font-size:0.95rem; font-weight:600;
    transform:translateY(-100%); transition:transform 0.25s ease;
  }
  #violation-banner.visible{ transform:translateY(0); }
  .reviewlist{ list-style:none; margin:0 0 22px; padding:0; }
  .reviewlist li{
    display:flex; justify-content:space-between; align-items:center;
    padding:10px 12px; border-bottom:1px solid var(--line); cursor:pointer; font-size:0.92rem;
  }
  .reviewlist li:hover{ background:#f7f7f7; }
  .status-ok{ color:var(--teal); font-weight:600; }
  .status-pending{ color:var(--red); font-weight:600; }
  .finished-icon{ font-size:2rem; margin-bottom:6px; }
  .note{ font-size:0.8rem; color:var(--ink-soft); margin-top:6px; line-height:1.5; }
  #watermark{
    position:fixed; inset:0; z-index:40; pointer-events:none;
    display:flex; flex-wrap:wrap; align-content:space-around; justify-content:space-around;
    opacity:0.10; overflow:hidden;
  }
  #watermark span{
    display:block; transform:rotate(-30deg); font-size:0.95rem; font-weight:600;
    color:var(--ink); white-space:nowrap; margin:26px;
  }
</style>
</head>
<body>
<div id="violation-banner"></div>
<div id="watermark"></div>
<div id="app">

  <!-- PANTALLA DE INICIO -->
  <div id="screen-start" class="card">
    <h1 id="start-title">Título del examen</h1>
    <p class="subtitle" id="start-subtitle"></p>
    <label for="input-name">Nombre y apellidos</label>
    <input type="text" id="input-name" placeholder="Ej: Marta García López" autocomplete="off">
    <label for="input-group">Grupo o clase (opcional)</label>
    <input type="text" id="input-group" placeholder="Ej: GES2A" autocomplete="off">
    <button id="btn-start">Empezar examen</button>
  </div>

  <!-- PANTALLA DE EXAMEN -->
  <div id="screen-exam" class="card hidden">
    <div class="examheader">
      <h2 id="exam-title-small">Título</h2>
      <span class="timer" id="timer">--:--</span>
    </div>
    <div class="progress" id="progress-label">Pregunta 1 de 1</div>
    <p class="qtext" id="qtext"></p>
    <div id="options"></div>
    <div class="navrow">
      <button class="secondary" id="btn-prev">Anterior</button>
      <button id="btn-next">Siguiente</button>
    </div>
  </div>

  <!-- PANTALLA DE REVISIÓN -->
  <div id="screen-review" class="card hidden">
    <h1>Revisar antes de entregar</h1>
    <p class="subtitle">Toca una pregunta para volver a ella. Cuando estés listo, entrega el examen.</p>
    <ul class="reviewlist" id="review-list"></ul>
    <button id="btn-submit">Entregar examen</button>
  </div>

  <!-- PANTALLA FINAL -->
  <div id="screen-finished" class="card hidden">
    <div class="finished-icon">✓</div>
    <h1>Examen entregado</h1>
    <p class="subtitle" id="finished-message"></p>
    <p class="note" id="finished-status">Enviando tu resultado…</p>
    <details style="margin-top:18px;">
      <summary style="cursor:pointer; color:var(--ink-soft); font-size:0.85rem;">Ver resumen (por si algo falla)</summary>
      <textarea id="summary-box" rows="6" readonly style="margin-top:10px;"></textarea>
      <div class="row">
        <button class="secondary" id="btn-copy">Copiar resultado</button>
        <button class="secondary" id="btn-download">Descargar (.txt)</button>
      </div>
    </details>
  </div>

</div>

<script>
/* ============================================================
   ✏️  EDITA SOLO ESTA PARTE PARA CADA EXAMEN
   ============================================================ */
const CONFIG = {
  examTitle: "RA 1 - Atenció a grups",         // Aparece arriba del examen
  // Envío automático (invisible) del resultado a tu hoja de cálculo vía Apps Script
  appsScriptUrl: "https://script.google.com/macros/s/AKfycbxLJON-0E47AWd_Y7hwi5rx_dYu8M0_hz0l1S9x-mqNXWIh0oOmPzcyZJIwM61DPzit/exec",
  // Conexión con tu Google Form — el resultado se envía solo, sin que el alumno haga nada
  googleForm: {
    actionUrl: "https://docs.google.com/forms/d/e/1FAIpQLSefFXl5L0RlSMLfPFDh87csPIzSVG8g-Jsq94dl94AVceyoOw/formResponse",
    entryNombre: "entry.1200009891",
    entryGrupo: "entry.9384732",
    entryNota: "entry.735306376",
    entryAvisos: "entry.36221568",
    entryMotivo: "entry.799380067",
    entryExamen: "entry.370173710"
  },
  instructions: "Cada resposta correcta suma 1 punt. Cada resposta incorrecta resta 0,5 punts. Les preguntes en blanc no sumen ni resten.",
  timeLimitMinutes: 30,                        // Duración del examen en minutos
  violationLimit: 2,                           // 1 aviso, y a la siguiente salida se entrega solo
  showScoreToStudent: true,                    // true = el alumno ve su nota al entregar

  // Puntos por acierto, por fallo y por pregunta en blanco
  scoring: { correct: 1, incorrect: -0.5, blank: 0 },

  questions: [
    {
      text: "El conjunt de qualitats i trets d'una persona que la diferencien de la resta fa referència a:",
      options: ["La personalitat", "El desenvolupament", "La maduració", "La individualitat"],
      correct: 0
    },
    {
      text: "A la capacitat de provocar, dirigir i mantenir la conducta cap a un objectiu l'anomenem…:",
      options: ["Desenvolupament personal.", "Actitud.", "Autoconcepte.", "Motivació."],
      correct: 3
    },
    {
      text: "A la valoració subjectiva que fa la persona sobre si mateixa en diem…:",
      options: ["Amor propi.", "Autoconcepte.", "Autoestima.", "Autopercepció."],
      correct: 2
    },
    {
      text: "La paràlisi cerebral és una discapacitat…:",
      options: [
        "Intel·lectual, perquè totes les persones amb paràlisi cerebral tenen una afectació cognitiva.",
        "Física, perquè totes les persones amb paràlisi cerebral tenen una afectació motora (moviment).",
        "Física, perquè totes les persones amb paràlisi cerebral tenen una afectació cognitiva (mental).",
        "Sensorial, perquè es veuen especialment afectades la vista i l'oïda (sentits)."
      ],
      correct: 1
    },
    {
      text: "Dins de les discapacitats físiques, la visual i l'auditiva…:",
      options: [
        "Són les que suposen menor dificultat en el desenvolupament de les tasques quotidianes.",
        "No tenen cap repercussió.",
        "Són les úniques discapacitats físiques que hi ha.",
        "Cap de les respostes anteriors és correcta."
      ],
      correct: 3
    },
    {
      text: "Quina de les formes següents és la més correcta per referir-nos a un grup d'estudiants format per nois i noies?",
      options: ["L'alumnat.", "Els alumnes i les alumnes.", "Les alumnes i els alumnes.", "Els alumnes."],
      correct: 0
    },
    {
      text: "La coeducació és una metodologia d'ensenyament que parteix de la no-discriminació per raons de…",
      options: ["Gènere.", "Ètnia.", "Ideologia.", "Totes les respostes anteriors són correctes"],
      correct: 3
    },
    {
      text: "Quina de les següents opcions descriu millor la motivació intrínseca?",
      options: [
        "Fer una activitat per obtenir un premi o una bonificació externa.",
        "Fer una activitat per la satisfacció personal que genera realitzar-la.",
        "Fer una activitat per evitar una conseqüència negativa o càstig.",
        "Totes les respostes anteriors son correctes"
      ],
      correct: 1
    },
    {
      text: "Quina de les següents opcions descriu millor la motivació extrínseca?",
      options: [
        "Fer una activitat per obtenir un premi o una bonificació externa.",
        "Fer una activitat per evitar un càstig.",
        "Fer una activitat per complaure a altres persones.",
        "Totes les respostes anteriors són correctes"
      ],
      correct: 3
    },
    {
      text: "Quina afirmació defineix millor la inclusió.",
      options: [
        "La inclusió busca que les persones amb discapacitat siguin tractades d'una manera especial.",
        "La inclusió es refereix només a la participació d'individus amb discapacitat en la societat.",
        "La inclusió busca que totes les persones participin activament en la societat.",
        "Totes les respostes anteriors són correctes."
      ],
      correct: 2
    }
  ]
};
/* ============================================================
   FIN DE LA PARTE EDITABLE — no hace falta tocar nada más abajo
   ============================================================ */

function slugify(s){
  return (s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"") || "resultado";
}
function shuffleArray(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
let examQuestions = CONFIG.questions; // se mezcla de verdad al empezar el examen (ver startExam)

// ---------- estado ----------
let studentName = "", studentGroup = "";
let currentIndex = 0;
let answers = {};
let violations = [];
let violationCount = 0;
let lastViolationTime = 0;
let examActive = false;
let finished = false;
let manualFullscreenExit = false;
let remainingSeconds = CONFIG.timeLimitMinutes * 60;
let timerInterval = null;

// ---------- elementos ----------
const el = id => document.getElementById(id);
const screens = {
  start: el('screen-start'), exam: el('screen-exam'),
  review: el('screen-review'), finished: el('screen-finished')
};
function showScreen(name){
  Object.values(screens).forEach(s => s.classList.add('hidden'));
  screens[name].classList.remove('hidden');
}

// ---------- pantalla de inicio ----------
el('start-title').textContent = CONFIG.examTitle;
el('start-subtitle').textContent = CONFIG.instructions;
el('exam-title-small').textContent = CONFIG.examTitle;

el('btn-start').addEventListener('click', () => {
  const name = el('input-name').value.trim();
  if(!name){ el('input-name').focus(); el('input-name').style.borderColor = 'var(--red)'; return; }
  studentName = name;
  studentGroup = el('input-group').value.trim();
  startExam();
});

// ---------- inicio del examen ----------
function enterFullscreenSafe(){
  const elDoc = document.documentElement;
  const req = elDoc.requestFullscreen || elDoc.webkitRequestFullscreen || elDoc.msRequestFullscreen;
  if(req){ try{ req.call(elDoc).catch(()=>{}); }catch(e){} }
}
function exitFullscreenSafe(){
  manualFullscreenExit = true;
  const exitFn = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
  if(exitFn && (document.fullscreenElement || document.webkitFullscreenElement)){
    try{ exitFn.call(document).catch(()=>{}); }catch(e){}
  }
}

function startExam(){
  examQuestions = shuffleArray(CONFIG.questions);
  fillWatermark();
  enterFullscreenSafe();
  examActive = true;
  showScreen('exam');
  renderQuestion();
  timerInterval = setInterval(tickTimer, 1000);
  updateTimerDisplay();
}
function fillWatermark(){
  const label = `${studentName} · ${new Date().toLocaleDateString()}`;
  const wm = el('watermark');
  wm.innerHTML = "";
  for(let i = 0; i < 40; i++){
    const span = document.createElement('span');
    span.textContent = label;
    wm.appendChild(span);
  }
}

function tickTimer(){
  remainingSeconds--;
  updateTimerDisplay();
  if(remainingSeconds <= 0){
    clearInterval(timerInterval);
    submitExam("tiempo agotado");
  }
}
function updateTimerDisplay(){
  const m = Math.max(0, Math.floor(remainingSeconds/60));
  const s = Math.max(0, remainingSeconds%60);
  const label = `${m}:${s.toString().padStart(2,'0')}`;
  const t = el('timer');
  t.textContent = label;
  t.classList.toggle('low', remainingSeconds <= 60);
}

// ---------- preguntas ----------
function renderQuestion(){
  const q = examQuestions[currentIndex];
  el('progress-label').textContent = `Pregunta ${currentIndex+1} de ${examQuestions.length}`;
  el('qtext').textContent = q.text;
  const wrap = el('options');
  wrap.innerHTML = "";
  q.options.forEach((opt, i) => {
    const div = document.createElement('div');
    div.className = 'option' + (answers[currentIndex] === i ? ' selected' : '');
    div.innerHTML = `<input type="radio" name="opt" ${answers[currentIndex]===i?'checked':''}><span>${opt}</span>`;
    div.addEventListener('click', () => { answers[currentIndex] = i; renderQuestion(); });
    wrap.appendChild(div);
  });
  el('btn-prev').disabled = currentIndex === 0;
  el('btn-next').textContent = currentIndex === examQuestions.length - 1 ? "Revisar y entregar" : "Siguiente";
}
el('btn-prev').addEventListener('click', () => { currentIndex--; renderQuestion(); });
el('btn-next').addEventListener('click', () => {
  if(currentIndex < examQuestions.length - 1){ currentIndex++; renderQuestion(); }
  else { showReview(); }
});

function showReview(){
  showScreen('review');
  const list = el('review-list');
  list.innerHTML = "";
  examQuestions.forEach((q, i) => {
    const li = document.createElement('li');
    const answered = answers[i] !== undefined;
    li.innerHTML = `<span>Pregunta ${i+1}</span><span class="${answered?'status-ok':'status-pending'}">${answered?'Respondida':'Sin responder'}</span>`;
    li.addEventListener('click', () => { currentIndex = i; showScreen('exam'); renderQuestion(); });
    list.appendChild(li);
  });
}
el('btn-submit').addEventListener('click', () => submitExam("entregado por el alumno"));

// ---------- detección de salidas ----------
function handleViolation(reason){
  if(!examActive || finished) return;
  const now = Date.now();
  if(now - lastViolationTime < 1500) return;
  lastViolationTime = now;
  violations.push({ reason, time: new Date().toISOString() });
  violationCount++;
  if(violationCount < CONFIG.violationLimit){
    showBanner("Avís: has sortit de la pantalla de l'examen. Si torna a passar, l'examen s'acabarà i s'entregarà automàticament.");
  }
  if(violationCount >= CONFIG.violationLimit){
    submitExam("entregado automáticamente por exceso de salidas de pantalla");
  }
}
let bannerTimeout = null;
function showBanner(msg){
  const b = el('violation-banner');
  b.textContent = msg;
  b.classList.add('visible');
  clearTimeout(bannerTimeout);
  bannerTimeout = setTimeout(() => b.classList.remove('visible'), 4000);
}
document.addEventListener('visibilitychange', () => {
  if(examActive && document.hidden) handleViolation("un cambio de pestaña o de aplicación");
});
window.addEventListener('blur', () => {
  if(examActive) handleViolation("una pérdida de foco de la ventana");
});
document.addEventListener('fullscreenchange', onFullscreenChange);
document.addEventListener('webkitfullscreenchange', onFullscreenChange);
function onFullscreenChange(){
  const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
  if(examActive && !isFs && !manualFullscreenExit) handleViolation("una salida de pantalla completa");
  manualFullscreenExit = false;
}

// ---------- bloqueo de copiar/pegar/menú contextual ----------
['contextmenu','copy','cut','paste'].forEach(evt => {
  document.addEventListener(evt, e => { if(examActive) e.preventDefault(); });
});
document.addEventListener('keydown', e => {
  if(!examActive) return;
  const key = e.key.toLowerCase();
  const ctrlCombo = (e.ctrlKey || e.metaKey) && ['c','v','x','u','s','p'].includes(key);
  const devtools = (e.ctrlKey && e.shiftKey && ['i','j','c'].includes(key)) || key === 'f12';
  if(ctrlCombo || devtools) e.preventDefault();
});

// ---------- corrección y entrega ----------
function isCorrectAnswer(q, given){
  if(Array.isArray(q.correct)) return q.correct.includes(given);
  return given === q.correct;
}
function computeScore(){
  const s = CONFIG.scoring || { correct: 1, incorrect: -0.5, blank: 0 };
  let total = 0;
  examQuestions.forEach((q, i) => {
    const given = answers[i];
    if(given === undefined) total += s.blank;
    else if(isCorrectAnswer(q, given)) total += s.correct;
    else total += s.incorrect;
  });
  return Math.round(total * 100) / 100;
}
function maxPossibleScore(){
  const s = CONFIG.scoring || { correct: 1 };
  return Math.round(examQuestions.length * s.correct * 100) / 100;
}

function buildSummary(score, total, reason){
  const lines = [
    `Examen: ${CONFIG.examTitle}`,
    `Alumno/a: ${studentName}`,
    studentGroup ? `Grupo: ${studentGroup}` : null,
    `Nota: ${score} / ${total}`,
    `Avisos de salida de pantalla: ${violationCount}`,
    `Motivo de entrega: ${reason}`,
    `Fecha: ${new Date().toLocaleString()}`
  ].filter(Boolean);
  return lines.join('\n');
}

function submitExam(reason){
  if(finished) return;
  finished = true;
  examActive = false;
  clearInterval(timerInterval);
  exitFullscreenSafe();

  const score = computeScore();
  const total = maxPossibleScore();
  const summary = buildSummary(score, total, reason);

  showScreen('finished');
  let msg = `Gracias, ${studentName}. Tu examen ha terminado.`;
  if(CONFIG.showScoreToStudent) msg += ` Nota: ${score} de ${total}.`;
  if(reason !== "entregado por el alumno") msg += ` (Motivo de entrega: ${reason}.)`;
  el('finished-message').textContent = msg;
  el('summary-box').value = summary;
  setupResultActions(summary);
  sendResultAutomatically(score, total, reason);
}

function sendResultAutomatically(score, total, reason){
  const statusEl = el('finished-status');
  if(!CONFIG.appsScriptUrl){
    statusEl.textContent = "No hay conexión configurada. Usa \"Ver resumen\" para enviarlo tú mismo/a.";
    return;
  }
  const params = new URLSearchParams({
    examen: CONFIG.examTitle,
    nombre: studentName,
    grupo: studentGroup,
    nota: `${score} / ${total}`,
    avisos: String(violationCount),
    motivo: reason
  });
  const url = `${CONFIG.appsScriptUrl}?${params.toString()}`;
  statusEl.textContent = "Resultado enviado correctamente. Ya puedes cerrar esta ventana.";
  fetch(url, { method: 'GET', mode: 'no-cors' })
    .catch(() => { statusEl.textContent = "No se pudo enviar (¿sin conexión?). Abre \"Ver resumen\" y avisa a tu profesor/a."; });
}

function setupResultActions(summary){
  const copyBtn = el('btn-copy');
  copyBtn.onclick = async () => {
    try{
      await navigator.clipboard.writeText(summary);
    }catch(e){
      const ta = el('summary-box');
      ta.removeAttribute('readonly'); ta.focus(); ta.select();
      document.execCommand('copy');
      ta.setAttribute('readonly', 'true');
    }
    copyBtn.textContent = "Copiado ✓";
    setTimeout(() => { copyBtn.textContent = "Copiar resultado"; }, 2000);
  };

  el('btn-download').onclick = () => {
    const blob = new Blob([summary], { type: 'text/plain;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `resultado_${slugify(studentName)}.txt`;
    a.click();
    URL.revokeObjectURL(url);
  };
}
</script>
</body>
</html>
